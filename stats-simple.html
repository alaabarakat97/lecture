<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الإحصائيات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .counter {
      background: white;
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
    }

    .counter .number {
      font-size: 72px;
      font-weight: 700;
      color: #667eea;
    }

    .counter .label {
      color: #666;
      font-size: 18px;
      margin-top: 10px;
    }

    .visits-list {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .visits-list h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .visit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .visit-item:last-child {
      border-bottom: none;
    }

    .visit-number {
      background: #667eea;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .visit-details {
      flex: 1;
      margin-right: 15px;
    }

    .visit-date {
      color: #333;
      font-weight: 600;
      font-size: 16px;
    }

    .visit-time {
      color: #666;
      font-size: 14px;
    }

    .config {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .config h2 {
      color: #333;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .config input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: monospace;
    }

    .config button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .config button:hover {
      background: #5568d3;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 الإحصائيات</h1>
    </div>

    <div class="config">
      <h2>⚙️ الإعدادات</h2>
      <input type="text" id="jsonbinId" placeholder="JSONBin ID" />
      <input type="text" id="apiKey" placeholder="API Key" />
      <button onclick="saveConfig()">حفظ الإعدادات</button>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div class="counter">
      <div class="number" id="totalVisits">-</div>
      <div class="label">إجمالي الزيارات</div>
    </div>

    <div class="visits-list">
      <h2>📋 سجل الزيارات</h2>
      <div id="visitsList">
        <div class="empty">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <script>
    function getConfig() {
      return {
        jsonbinId: localStorage.getItem('jsonbin_id') || '',
        apiKey: localStorage.getItem('jsonbin_api_key') || ''
      };
    }

    function saveConfig() {
      const jsonbinId = document.getElementById('jsonbinId').value;
      const apiKey = document.getElementById('apiKey').value;

      if (jsonbinId && apiKey) {
        localStorage.setItem('jsonbin_id', jsonbinId);
        localStorage.setItem('jsonbin_api_key', apiKey);
        alert('تم حفظ الإعدادات');
        loadStats();
      }
    }

    async function loadStats() {
      const config = getConfig();

      if (!config.jsonbinId || !config.apiKey) {
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'الرجاء إدخال JSONBin ID و API Key';
        return;
      }

      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${config.jsonbinId}/latest`, {
          headers: {
            'X-Master-Key': config.apiKey
          }
        });

        if (!response.ok) {
          throw new Error('فشل قراءة البيانات');
        }

        const data = await response.json();
        const record = data.record;

        if (!record) {
          document.getElementById('totalVisits').textContent = '0';
          document.getElementById('visitsList').innerHTML = '<div class="empty">لا توجد زيارات بعد</div>';
          return;
        }

        // تحديث العداد
        document.getElementById('totalVisits').textContent = record.totalVisits || 0;

        // تحديث قائمة الزيارات
        if (record.visits && record.visits.length > 0) {
          document.getElementById('visitsList').innerHTML = record.visits.map((visit, index) => `
            <div class="visit-item">
              <div class="visit-number">${index + 1}</div>
              <div class="visit-details">
                <div class="visit-date">${visit.date}</div>
                <div class="visit-time">${visit.time}</div>
              </div>
            </div>
          `).join('');
        } else {
          document.getElementById('visitsList').innerHTML = '<div class="empty">لا توجد زيارات بعد</div>';
        }

        document.getElementById('error').style.display = 'none';

      } catch (error) {
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'خطأ: ' + error.message;
      }
    }

    // تحميل الإعدادات المحفوظة
    const config = getConfig();
    document.getElementById('jsonbinId').value = config.jsonbinId;
    document.getElementById('apiKey').value = config.apiKey;

    // تحميل الإحصائيات إذا كانت الإعدادات موجودة
    if (config.jsonbinId && config.apiKey) {
      loadStats();
    }
  </script>
</body>
</html>
